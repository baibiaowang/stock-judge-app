name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  # ★ 固定签名：密钥来自仓库 Secrets（不是 runner 临时生成的 debug.keystore）。
  #   versionCode 在 Compute version 步骤里算 —— GitHub 表达式不支持算术运算符，
  #   写 ${{ 1000 + github.run_number }} 会让整个 workflow 编译失败（0 个 job）。
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # versionCode 必须单调递增，否则覆盖安装报 INSTALL_FAILED_VERSION_DOWNGRADE
      - name: Compute version
        run: |
          set -euo pipefail
          CODE=$((1000 + ${{ github.run_number }}))
          NAME="2026.09.20.${{ github.run_number }}"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "version -> code=$CODE name=$NAME"

      # Capacitor CLI (8.x) 要求 Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor 8 的 Android 侧要 JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOTE: 不要用 android-actions/setup-android@v3（它会跑 sdkmanager tools，
      # 而 tools 包已被移除，必然失败并 skip 后续步骤）。runner 预装 SDK，直接用。
      - name: Android SDK diagnostics
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          echo "node=$(node -v)  java=$(java -version 2>&1 | head -1)"

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          for p in "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"; do
            if "$SM" "$p" >/dev/null 2>&1; then echo "ok: $p"; else echo "::warning::could not install $p"; fi
          done

      # ★ 早跑，早点暴露密钥问题。inject.mjs 读 www/（含占位符），产物写 dist/www/，源文件不动。
      - name: Inject secrets into web assets
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          DATA_URL: ${{ secrets.DATA_URL }}
        run: node native/inject.mjs

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      # 版本锁在 package.json 里，这里按它装，避免上游升大版本炸构建
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx cap --version || true

      - name: Add Android platform
        run: npx cap add android

      - name: Inject native file-open support
        run: |
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs

      # ★ 固定签名第一步：把 keystore 从 Secret 恢复到工作区（放仓库根，不依赖 android/ 是否已生成）
      - name: Prepare fixed signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing Android signing secrets:$MISSING"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing.p12
          echo "SIGNING_KEYSTORE_PATH=$(pwd)/signing.p12" >> "$GITHUB_ENV"
          echo "[signing] keystore restored ($(wc -c < signing.p12) bytes)"

      # ★ 固定签名第二步：把 signingConfigs.release 注入 cap add 生成的 build.gradle
      #   （android/ 每次重建，所以必须在生成之后注入，不能改仓库里的源文件）
      - name: Configure fixed release signing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'android/app/build.gradle';
          if (!fs.existsSync(p)) { console.error('::error::android/app/build.gradle not found'); process.exit(1); }
          let s = fs.readFileSync(p, 'utf8');
          if (!/android\s*\{/.test(s) || !/buildTypes\s*\{/.test(s)) {
            console.error('::error::Unexpected Android Gradle file layout.'); process.exit(1);
          }
          if (!/signingConfigs\s*\{/.test(s)) {
            s = s.replace(/buildTypes\s*\{/, `signingConfigs {
              release {
                  storeFile file(System.getenv('SIGNING_KEYSTORE_PATH'))
                  storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('ANDROID_KEY_ALIAS')
                  keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
          }

          buildTypes {`);
          }
          const releaseBlock = /buildTypes\s*\{\s*release\s*\{/;
          if (!releaseBlock.test(s)) { console.error('::error::release buildType not found.'); process.exit(1); }
          if (!/buildTypes\s*\{\s*release\s*\{[^}]*signingConfig\s+signingConfigs\.release/s.test(s)) {
            s = s.replace(releaseBlock, `buildTypes {
              release {
                  signingConfig signingConfigs.release`);
          }
          fs.writeFileSync(p, s);
          console.log('[signing] fixed release signing configured.');
          NODE

      # ★ 版本号必须每次递增，否则旧机覆盖安装会被拒
      - name: Stamp version
        run: |
          set -euo pipefail
          G='android/app/build.gradle'
          sed -i "s/versionCode[[:space:]]*[0-9]*/versionCode ${APP_VERSION_CODE}/" "$G"
          sed -i "s/versionName[[:space:]]*[\"'][^\"']*[\"']/versionName \"${APP_VERSION_NAME}\"/" "$G"
          grep -nE "versionCode|versionName" "$G"

      - name: Sync web assets
        run: npx cap sync android

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build fixed-signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ★ 当场验收：签名不对就在这里炸，别等装机才知道
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          "${BT}apksigner" verify --print-certs "$APK" | head -12
          mkdir -p dist
          cp "$APK" dist/app.apk
          echo "Built v${APP_VERSION_NAME} (code ${APP_VERSION_CODE}) with fixed signing."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-judge-apk-v${{ github.run_number }}
          path: dist/app.apk
          if-no-files-found: error
          retention-days: 30

      # ★ 自动发布 Release：App 内「检查更新」读的就是它
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: 股票判断机 v${{ env.APP_VERSION_NAME }}
          body: |
            自动构建（run #${{ github.run_number }}）。
            - versionName: v${{ env.APP_VERSION_NAME }}
            - versionCode: ${{ env.APP_VERSION_CODE }}
            - 签名：固定正式签名密钥（每次一致，可直接覆盖安装）
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: dist/app.apk
