name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor CLI (8.x) 要求 Node >= 22，用 20 会在 `npx cap add android` 报
      # [fatal] The Capacitor CLI requires NodeJS >=22.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor 8 的 Android 侧要 JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOTE: 不要用 android-actions/setup-android@v3。
      # 它会执行 `sdkmanager tools`，而 `tools` 包已被 Google 从 SDK 仓库移除，
      # 必然报 `Failed to find package 'tools'` + exit 1，把后面所有步骤一起 skip。
      # ubuntu-latest runner 已预装 Android SDK（/usr/local/lib/android/sdk），直接用它。
      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          echo "--- platforms ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || true
          echo "node=$(node -v)  java=$(java -version 2>&1 | head -1)"

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          for p in "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"; do
            if "$SM" "$p" >/dev/null 2>&1; then
              echo "ok: $p"
            else
              echo "::warning::sdkmanager could not install $p (gradle will try to auto-download)"
            fi
          done

      # ★ 放在装依赖之前：inject.mjs 只用 Node 内置模块，早跑能早点暴露密钥问题。
      # 它读 www/（源文件，含占位符），把注入后的产物写到 dist/www/，源文件不动。
      - name: Inject secrets into web assets
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          DATA_URL: ${{ secrets.DATA_URL }}
        run: node native/inject.mjs

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      # ★ 2026-09-20：原来这里写的是 @capacitor/*@latest，每次都装最新版 ——
      # 上游升大版本时会突然要求更高的 Node/JDK，构建直接炸（已经炸过一次）。
      # 现在版本锁在 package.json 里，这里只按它装。
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx cap --version || true

      - name: Add Android platform
        run: npx cap add android

      - name: Inject native file-open support
        run: |
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-judge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

# Build trigger: keep APK build available on every relevant source update.
