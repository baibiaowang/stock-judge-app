name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: 不要用 android-actions/setup-android@v3。
      # 它会执行 `sdkmanager tools`，而 `tools` 包已被 Google 从 SDK 仓库移除，
      # 必然报 `Failed to find package 'tools'` + exit 1，把后面所有步骤一起 skip。
      # ubuntu-latest runner 已预装 Android SDK（/usr/local/lib/android/sdk），直接用它。
      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          echo "--- platforms ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || true

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          for p in "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"; do
            if "$SM" "$p" >/dev/null 2>&1; then
              echo "ok: $p"
            else
              echo "::warning::sdkmanager could not install $p (gradle will try to auto-download)"
            fi
          done

      - name: Inject secrets into web assets
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          DATA_URL: ${{ secrets.DATA_URL }}
        run: node native/inject.mjs

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Add Android platform
        run: npx cap add android

      - name: Inject native file-open support
        run: |
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-judge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
