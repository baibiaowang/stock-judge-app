name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Inject secrets into web assets
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          DATA_URL: ${{ secrets.DATA_URL }}
        run: node native/inject.mjs

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Add Android platform
        run: npx cap add android

      - name: Inject native file-open support
        run: |
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-judge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
